# Build configuration for Cokpyt (Wails v3)
version: '3'

info:
  companyName: "d3uceY"
  productName: "Cokpyt"
  productIdentifier: "io.github.d3ucey.cokpyt"
  description: "A desktop GUI for pip"
  copyright: "Copyright © 2026 d3uceY"
  comments: "Built using Wails (https://wails.io)"
  version: "0.3.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  # The frontend is served by Vite, which does its own hot reloading, so only
  # Go changes need to rebuild the binary. The bindings directory is generated
  # and watching it makes the rebuild loop chase its own output.
  #
  # Two things here are load-bearing and easy to break:
  #
  # `watched_extension` must be nested under `ignore` - that is where the
  # watcher's config struct keeps it. At the `dev_mode` level it is an unknown
  # key that gets dropped without a warning, the filter falls back to "watch
  # everything", and the build then retriggers itself through its own outputs.
  #
  # Each `dir` entry is compared against a single component of the *absolute*
  # event path, so a nested entry like `frontend/bindings` matches nothing at
  # all. Only bare directory names work here.
  ignore:
    dir:
      - .git
      - .task
      - bin
      - bindings
      - node_modules
      - dist
      - assets
      # `wails3 generate bindings --clean` stages its output in a dot-prefixed
      # sibling of the bindings directory and then syncs it in, so the generated
      # .js files appear under frontend/.bindings-tmp-<random>, not under
      # frontend/bindings. Those writes are watched, reset the debounce timer and
      # start the next build, which stages again - an endless reload loop. This
      # entry has to be a glob because the suffix is random; `dir` entries are
      # glob-matched against the whole path as well as being compared by name.
      - "*.bindings-tmp-*"
    file:
      - .DS_Store
      - .gitignore
    # Vite hot-reloads the frontend from source, so only Go changes need the
    # binary rebuilt and the window restarted.
    watched_extension:
      - "*.go"
  executes:
    - cmd: wails3 task bindings
      type: once
    - cmd: wails3 task deps
      type: once
    - cmd: wails3 task frontend
      type: background
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task run
      type: primary
