version: '3'

includes:
  common: ../Taskfile.yml

vars:
  APP_NAME: "Cokpyt"
  BIN_DIR: "bin"

tasks:
  build:
    summary: Builds Cokpyt for Linux
    # Sequenced rather than listed as deps: task runs deps in parallel, and the
    # frontend build needs the bindings it is generated from.
    cmds:
      - task: common:go:mod:tidy
      - task: common:prepare
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      # Wails v3 defaults to GTK4/WebKitGTK 6.0; the gtk3 tag keeps the build
      # on the GTK3/WebKit2GTK 4.1 stack that the release job installs.
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags dev,gtk3 -buildvcs=false -gcflags=all="-l"{{else}}-tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: '1'

  run:
    summary: Runs the built app
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"

  package:
    summary: Stages the binary and a .desktop entry under bin/
    deps:
      - task: build
    cmds:
      - cp build/linux/desktop "{{.BIN_DIR}}/{{.APP_NAME}}.desktop"
      - echo "binary at {{.BIN_DIR}}/{{.APP_NAME}}, desktop entry beside it"
