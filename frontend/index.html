<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cokpyt</title>
    <link rel="icon" href="/assets/logo-light.png" />
    <script>
      // Applied before first paint so the window never flashes the wrong
      // theme. The real value lives in the Go config; this is only a cache.
      const cached = localStorage.getItem("cokpyt.theme");
      if (cached === "dark" || cached === "light") {
        document.documentElement.dataset.theme = cached;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
