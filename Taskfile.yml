# `build`, `package` and `run` exist because the wails3 CLI is a thin wrapper:
# `wails3 build` runs the task named `build`, so these are the definitions it
# dispatches to. Do not rename them.

version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "Cokpyt"

tasks:
  build:
    summary: Builds the app for this OS
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages the app for this OS
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the built app
    cmds:
      - task: "{{OS}}:run"

  test:
    summary: Builds the frontend, then runs the Go tests
    cmds:
      # main.go embeds frontend/dist, so the bundle has to exist before Go can
      # compile, let alone test.
      - task: common:install:frontend:deps
      - task: common:build:frontend
      - go test ./...

  bindings:
    summary: Regenerates the frontend's bindings and bundled runtime
    cmds:
      - task: common:generate:bindings

  deps:
    summary: Installs the frontend's npm dependencies
    cmds:
      - task: common:install:frontend:deps

  frontend:
    summary: Runs the Vite dev server that `wails3 dev` proxies to
    cmds:
      - task: common:dev:frontend
